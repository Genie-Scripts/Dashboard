# ──────────────────────────────────────────────────────
# management_policy.example.yaml — 今期の経営方針（業務方向性）のテンプレート
# ──────────────────────────────────────────────────────
#
# 使い方:
#   このファイルを  data/management_policy.yaml  にコピーして中身を書き換える。
#   （data/ は .gitignore 済み＝院内非公開。PUBLIC リポには載らない）
#
# なぜ data/ に置くか:
#   config/evaluation_rules.yaml は公開リポにコミットされる。経営方針・部門戦略などの
#   内部情報はここ（この example）ではなく data/ 側の実ファイルに書くこと。
#
# 反映:
#   priorities の各行は AI アラート（見出し/本文/アクション）のプロンプトに
#   「今期の経営方針（最優先）」として自動注入され、評価軸と打ち手の優先順位を枠づける。
#   generate_html.py の再実行（＝ハブの「生成・公開」）で反映される。
#
# 書き方のコツ:
#   - 「今期は〜を最優先する」「〜より〜を重視する」等の方向性を1行ずつ
#   - 四半期ごとに1〜3行を書き換えるだけの軽い運用を想定
# ──────────────────────────────────────────────────────

priorities:
  - 今期の最優先は手術件数の回復。手術に連動する新入院・紹介の動きを重視する
  - 病床は回転を重視し、稼働率の単独評価はしない（在院日数の適正化とセットで見る）
  - 週末・連休の一時的な落ち込みは過度に問題視せず、継続的な傾向を優先して評価する
