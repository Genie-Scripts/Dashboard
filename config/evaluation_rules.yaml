# ──────────────────────────────────────────────────────
# evaluation_rules.yaml — AI分析の評価軸・優先順位ルール
# ──────────────────────────────────────────────────────
#
# このファイルの内容はローカルLLM（oMLX）のプロンプトに
# 自動注入されます。自由に追記・修正してください。
#
# 書き方のコツ:
#   - 「〜を重視する」「〜を優先する」等の指示形で書く
#   - 具体的な閾値やキーワードを含めるとより効果的
#   - 行頭の「-」で箇条書き
#
# 反映タイミング: generate_html.py の再実行時に自動反映
# ──────────────────────────────────────────────────────

# ────────────────────────────
# 全体方針（全アラート・全ストーリーに共通適用）
# ────────────────────────────
global_rules:
  - 祝日・連休の前後は入院・手術件数が自然減するため、単純な数値低下をそのまま「悪化」と断定しない
  - 祝日・連休の影響に言及してよいのは【暦の事実】として該当週に祝日が明示された場合のみ。明示が無ければ祝日・連休には一切言及しない（暦を推測しない）
  - 【暦の事実】でゴールデンウィーク（4/29〜5/5前後）・お盆（8/13〜8/16前後）・年末年始（12/29〜1/3）に該当すると示された場合、その影響は特に大きい
  - 月初は前月退院の反動で在院が減少しやすい傾向がある。月初データの一時的な低下は過度に問題視しない
  - 経営改善のアクションにつながる示唆を優先し、単なる数値の読み上げにならないようにする

  # ↓ ここから: 人手 override（添削）の蒸留由来（添削フィードバックループ P2・2026-07-24）
  #    出典 = dept_reports/_state/edits_digest.md。いずれも複数回・一貫して現れた書き換え。
  - 診療科群を指すときは「同種診療科」と書かず、「内科系診療科」「外科系診療科」のように具体的な群名で表記する
  - 祝日・連休の影響に触れる場合は文末に付け足さず、「祝日の影響もありますが、」のように文頭で前置きしてから本題を述べる
  - 目標未達を表すときは「大きく下回る」と誇張せず「下回る」と書く（「明確に下回る」は可）
  - action は「現状維持」で完結させず、状況が良好な場合でも次に伸ばす具体的な一手を必ず添える

# ────────────────────────────
# 診療科グループ別の評価方針
# ────────────────────────────
dept_group_rules:
  # 外科系（手術件数・稼働率が最重要）
  surgical:
    depts:
      - 一般消化器外科
      - 整形外科
      - 脳神経外科
      - 心臓血管外科
      - 呼吸器外科
      - 泌尿器科
      - 乳腺外科
      - 形成外科
      - 産婦人科
      - 歯科口腔外科
      - 耳鼻咽喉科
      - 皮膚科
    rules:
      - 手術件数の目標達成が最優先評価軸である
      - 手術室稼働率の低下は経営インパクトが大きいため重点的に言及する
      - 新入院の減少が手術件数の減少に連動している場合はその関係に触れる
      - 全身麻酔手術件数を目標比で大きく上回っている場合は、在院患者数や退院曜日の偏りを強く指摘せず、手術実績を主軸に肯定的に評価する
    # levers: この群が実際に動かせる打ち手。AIアラートの action はここから状況に合うものを選ぶ。
    # ※一般的な運用策のみ（機密の経営判断は data/management_policy.yaml へ）。実態に合わせて追記・修正可。
    levers:
      - 手術枠の稼働状況を確認し、空き枠の再配分や追加枠の調整を行う
      - 紹介元医療機関への働きかけを地域連携室と連携して強化する
      - 予定手術の前倒し・平準化で手術室稼働の谷を埋める

  # 内科系（新入院・在院日数が重要）
  medical:
    depts:
      - 総合内科
      - 循環器内科
      - 消化器内科
      - 呼吸器内科
      - 血液内科
      - 腎内科
      - 脳神経内科
      - リウマチ膠原病内科
    rules:
      - 新入院患者数の確保と在院日数の適正化が主な評価軸である
      - 在院患者数の変動は病床回転率と合わせて評価する
      - 紹介患者の動向は中長期的な患者獲得の先行指標として重視する
    levers:
      # 「継続的・安定的な紹介」は添削由来の加筆（P2・2026-07-24）
      - 新入院・紹介患者の確保に向けて地域連携室と連携し、継続的・安定的な紹介につなげる
      - 退院支援を前倒しして病床回転を高め、在院日数を適正化する
      - 予定入院の曜日設計を見直し、週内の在院の谷を埋める
      - 在院患者数の底上げに取り組む   # 添削由来（P2・2026-07-24）

  # 救急（件数よりも受入体制）
  emergency:
    depts:
      - 救急科
    rules:
      - 緊急入院件数の増減は病院全体の稼働に波及するため注視する
      - 救急受入数は地域医療への貢献度を示す指標でもある
    levers:
      - 救急車受入台数の増加に注力する   # 添削由来（P2・2026-07-24）
      - 救急受入体制（当直・病床確保）の維持・強化を図る
      - 応需率の低下要因を確認し、受入枠や後方病床の調整を行う

# ────────────────────────────
# KPIカテゴリ別の補足ルール
# ────────────────────────────
kpi_rules:
  inpatient:
    - 在院患者数は病床利用率と直結するため、経営の根幹指標として扱う
    - 平日と休日で目標値が異なることに留意する
    - 在院患者数が低い場合の打ち手は新入院・紹介患者の確保であり、在院日数の短縮や早期退院は勧めない（在院を下げてしまい逆効果）
  admission:
    - 新入院は「将来の在院」を示す先行指標として重視する
    - 診療科ごとの偏りがある場合は、特定科への依存リスクにも触れる
  operation:
    - 全身麻酔手術件数は診療報酬上のインパクトが最も大きい
    - 手術室稼働率が低い場合は、枠の再配分や集約化の検討を示唆する

# ────────────────────────────
# 退院曜日平準化のルール（portal「退院平準化」発信用）
# ────────────────────────────
discharge_leveling_rules:
  - テーマは退院の「曜日平準化」。週後半（特に土曜）に偏った退院を、谷である月曜へ付け替えることを促す
  - 退院を早める・在院日数を短縮する提案は絶対にしない。これは曜日の付け替えであり、総退院数・平均在院は維持する
  - 標準アクションは「土曜予定の退院を月曜へ。週末は退院準備を進め、月曜に実行」
  - 月曜の退院枠を増やすには、週末の退院支援・調整体制を前倒しで準備することが要点
  - 平準化は病床回転の安定と週末の業務負荷軽減が狙い。在院・粗利を犠牲にしないことを明示する
  - 再配分率が直近で低下している（改善傾向）場合は、まず肯定的に評価し、その上でさらなる平準化（土曜→月曜）を促す
  - 全身麻酔手術を目標比で大きく上回っている外科系は、退院曜日の偏りを強く指摘しない（手術実績を優先評価）

# ────────────────────────────
# 週次ストーリー固有のルール
# ────────────────────────────
weekly_story_rules:
  - 最も経営インパクトが大きい変化を冒頭で述べる
  - 複数KPIが同方向に動いている場合は構造的な要因の可能性に触れる（祝日・連休は【暦の事実】で示された場合のみ要因に挙げる）
  - 改善傾向にあるKPIも必ず1つは言及し、バランスの取れた報告にする
  - 前週と大きな変化がない場合は「安定推移」と端的に述べ、無理に問題を見出さない
