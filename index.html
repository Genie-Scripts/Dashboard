<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>配信先変更のお知らせ｜診療KPIダッシュボード</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f6f8;
    color: #1f2933;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.8;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    background: #fff;
    max-width: 560px;
    width: 100%;
    padding: 40px 32px;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
    border-top: 4px solid #2b6cb0;
  }
  h1 { font-size: 1.35rem; margin: 0 0 20px; color: #2b6cb0; }
  p { margin: 0 0 16px; font-size: .98rem; }
  .note {
    background: #f7fafc;
    border-left: 3px solid #cbd5e0;
    padding: 14px 16px;
    font-size: .9rem;
    color: #4a5568;
    margin: 24px 0 0;
  }
  .foot { margin: 28px 0 0; font-size: .82rem; color: #718096; }
</style>
</head>
<body>
  <main class="card">
    <h1>配信先を変更しました</h1>
    <p>診療KPIダッシュボードは、セキュリティ強化のため配信先を移転しました。このURLでの公開は終了しています。</p>
    <p>新しい閲覧先とログイン情報は、<strong>院内でご案内しています</strong>。お手元の案内をご確認ください。</p>
    <div class="note">
      案内が見当たらない場合、またはご不明な点がある場合は、ダッシュボードの担当部署までお問い合わせください。
    </div>
    <p class="foot">このページはブックマークから来られた方向けの案内です。</p>
  </main>
</body>
</html>
